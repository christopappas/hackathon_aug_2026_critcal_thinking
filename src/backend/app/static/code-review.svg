<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#12263a">Tracing average_score([80, 90, 100])</text>

  <rect x="216" y="48" width="144" height="88" rx="10" fill="#fdecea" stroke="#d64545" stroke-width="2"/>
  <text x="288" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#a02020">scores[0] = 80</text>
  <text x="288" y="98" text-anchor="middle" font-size="12" fill="#a02020">never added</text>
  <text x="288" y="118" text-anchor="middle" font-size="11" fill="#a02020">to the total</text>

  <rect x="30" y="120" width="156" height="112" rx="10" fill="#eef4ff" stroke="#2f6feb" stroke-width="2"/>
  <text x="108" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#12263a">loop starts at</text>
  <text x="108" y="180" text-anchor="middle" font-size="24" font-weight="700" fill="#2f6feb">i = 1</text>
  <text x="108" y="208" text-anchor="middle" font-size="11" fill="#5b6b7c">not i = 0</text>

  <rect x="396" y="120" width="174" height="112" rx="10" fill="#eef4ff" stroke="#2f6feb" stroke-width="2"/>
  <text x="483" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#12263a">then divides by</text>
  <text x="483" y="180" text-anchor="middle" font-size="20" font-weight="700" fill="#2f6feb">len(scores) = 3</text>
  <text x="483" y="208" text-anchor="middle" font-size="11" fill="#5b6b7c">190 / 3 = 63.3</text>

  <path d="M186 176 L396 176" stroke="#33475b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M108 120 L108 100 Q108 90 118 90 L216 90" stroke="#d64545" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>

  <text x="291" y="166" text-anchor="middle" font-size="11" fill="#5b6b7c">adds 90 + 100 = 190</text>

  <rect x="30" y="288" width="330" height="80" rx="10" fill="#fff7e0" stroke="#e0a800" stroke-width="2"/>
  <text x="48" y="316" font-size="13" font-weight="600" fill="#8a6100">Also untested:</text>
  <text x="48" y="338" font-size="12" fill="#8a6100">average_score([]) divides by zero</text>
  <text x="48" y="356" font-size="12" fill="#8a6100">and crashes the program.</text>

  <text x="400" y="316" font-size="13" fill="#33475b">Expected average:</text>
  <text x="400" y="344" font-size="22" font-weight="700" fill="#06a37f">90.0</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#33475b"/>
    </marker>
    <marker id="arrowred" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d64545"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#12263a">My spelling test scores</text>

  <line x1="100" y1="320" x2="440" y2="320" stroke="#33475b" stroke-width="2"/>
  <line x1="100" y1="60" x2="100" y2="320" stroke="#33475b" stroke-width="2"/>

  <text x="72" y="325" font-size="11" fill="#33475b">0</text>
  <text x="66" y="255" font-size="11" fill="#33475b">10</text>
  <text x="66" y="190" font-size="11" fill="#33475b">14</text>
  <text x="66" y="125" font-size="11" fill="#33475b">18</text>
  <text x="66" y="65" font-size="11" fill="#33475b">20</text>

  <rect x="132" y="112" width="120" height="208" fill="#6f42c1"/>
  <text x="192" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#6f42c1">18 / 20</text>
  <text x="192" y="342" text-anchor="middle" font-size="13" fill="#12263a">With music</text>
  <text x="192" y="358" text-anchor="middle" font-size="11" fill="#5b6b7c">this week</text>

  <rect x="312" y="176" width="120" height="144" fill="#9aa7b5"/>
  <text x="372" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#5b6b7c">14 / 20</text>
  <text x="372" y="342" text-anchor="middle" font-size="13" fill="#12263a">No music</text>
  <text x="372" y="358" text-anchor="middle" font-size="11" fill="#5b6b7c">last month</text>

  <rect x="444" y="80" width="144" height="120" rx="8" fill="#fff7e0" stroke="#e0a800" stroke-width="2"/>
  <text x="516" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#8a6100">How many</text>
  <text x="516" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#8a6100">students?</text>
  <text x="516" y="156" text-anchor="middle" font-size="30" font-weight="700" fill="#8a6100">1</text>
  <text x="516" y="182" text-anchor="middle" font-size="11" fill="#8a6100">tested one time</text>

  <rect x="24" y="340" width="396" height="52" rx="8" fill="#fdecea" stroke="#d64545" stroke-width="1.5"/>
  <text x="40" y="362" font-size="11.5" fill="#a02020">The two tests were a month apart and used different spelling words.</text>
  <text x="40" y="380" font-size="11.5" fill="#a02020">Study time and how hard the words were also changed.</text>
</svg>

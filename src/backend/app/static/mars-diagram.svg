<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="400" fill="#0d1b2a"/>
  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Dark streaks on a Mars crater wall</text>

  <rect x="36" y="80" width="156" height="200" rx="8" fill="#c1440e"/>
  <path d="M36 80 L192 80 L192 130 L36 160 Z" fill="#8a3009" opacity="0.5"/>
  <g stroke="#3d1a05" stroke-width="7" stroke-linecap="round">
    <line x1="70" y1="150" x2="78" y2="255"/>
    <line x1="100" y1="140" x2="110" y2="262"/>
    <line x1="132" y1="148" x2="140" y2="250"/>
    <line x1="160" y1="158" x2="166" y2="240"/>
  </g>
  <text x="114" y="300" text-anchor="middle" font-size="13" fill="#ffd166">Mars summer</text>
  <text x="114" y="318" text-anchor="middle" font-size="11" fill="#c9d4de">streaks appear</text>

  <rect x="228" y="80" width="144" height="200" rx="8" fill="#c1440e"/>
  <path d="M228 80 L372 80 L372 130 L228 160 Z" fill="#8a3009" opacity="0.5"/>
  <g stroke="#3d1a05" stroke-width="7" stroke-linecap="round" opacity="0.15">
    <line x1="262" y1="150" x2="270" y2="255"/>
    <line x1="292" y1="140" x2="302" y2="262"/>
    <line x1="324" y1="148" x2="332" y2="250"/>
  </g>
  <text x="300" y="300" text-anchor="middle" font-size="13" fill="#8ecae6">Mars winter</text>
  <text x="300" y="318" text-anchor="middle" font-size="11" fill="#c9d4de">streaks fade</text>

  <text x="411" y="78" font-size="12" fill="#c9d4de">Two possible causes:</text>
  <rect x="396" y="88" width="180" height="62" rx="8" fill="#14304a" stroke="#2f6feb" stroke-width="2"/>
  <text x="486" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#8ecae6">Salty water</text>
  <text x="486" y="134" text-anchor="middle" font-size="11" fill="#c9d4de">flowing down the slope</text>

  <rect x="396" y="162" width="180" height="62" rx="8" fill="#3a2a14" stroke="#e0a800" stroke-width="2"/>
  <text x="486" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#ffd166">Dry sand</text>
  <text x="486" y="208" text-anchor="middle" font-size="11" fill="#c9d4de">sliding down the slope</text>

  <text x="486" y="248" text-anchor="middle" font-size="12" fill="#ff8fa3">Both still possible</text>

  <rect x="36" y="304" width="360" height="72" rx="8" fill="#14304a" stroke="#5b6b7c" stroke-width="1.5"/>
  <text x="54" y="330" font-size="13" font-weight="600" fill="#ffffff">What was NOT found:</text>
  <text x="54" y="352" font-size="12" fill="#c9d4de">No living thing. No fossil. No sign of anything alive.</text>
  <text x="54" y="368" font-size="12" fill="#c9d4de">Water was not directly measured either.</text>
</svg>

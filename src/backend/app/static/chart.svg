<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#12263a">Daily Screen Time vs. Math Final Score</text>

  <line x1="100" y1="320" x2="560" y2="320" stroke="#33475b" stroke-width="2"/>
  <line x1="100" y1="40" x2="100" y2="320" stroke="#33475b" stroke-width="2"/>

  <text x="60" y="325" font-size="11" fill="#33475b">60</text>
  <text x="60" y="255" font-size="11" fill="#33475b">70</text>
  <text x="60" y="185" font-size="11" fill="#33475b">80</text>
  <text x="60" y="115" font-size="11" fill="#33475b">90</text>
  <text x="60" y="45" font-size="11" fill="#33475b">100</text>
  <text x="30" y="190" font-size="12" fill="#33475b" transform="rotate(-90 30 190)">Math score (%)</text>

  <text x="100" y="340" font-size="11" fill="#33475b" text-anchor="middle">0</text>
  <text x="253" y="340" font-size="11" fill="#33475b" text-anchor="middle">2</text>
  <text x="407" y="340" font-size="11" fill="#33475b" text-anchor="middle">4</text>
  <text x="560" y="340" font-size="11" fill="#33475b" text-anchor="middle">6</text>
  <text x="330" y="358" font-size="12" fill="#33475b" text-anchor="middle">Daily screen time (hours)</text>

  <line x1="110" y1="100" x2="550" y2="272" stroke="#d64545" stroke-width="2.5" stroke-dasharray="6 4"/>

  <g fill="#2f6feb">
    <circle cx="138" cy="96" r="5"/>
    <circle cx="161" cy="124" r="5"/>
    <circle cx="177" cy="110" r="5"/>
    <circle cx="192" cy="145" r="5"/>
    <circle cx="215" cy="138" r="5"/>
    <circle cx="253" cy="152" r="5"/>
    <circle cx="269" cy="180" r="5"/>
    <circle cx="292" cy="166" r="5"/>
    <circle cx="330" cy="194" r="5"/>
    <circle cx="345" cy="215" r="5"/>
    <circle cx="368" cy="187" r="5"/>
    <circle cx="407" cy="236" r="5"/>
    <circle cx="422" cy="250" r="5"/>
    <circle cx="445" cy="222" r="5"/>
    <circle cx="484" cy="264" r="5"/>
    <circle cx="522" cy="278" r="5"/>
  </g>

  <g fill="#2f6feb">
    <circle cx="453" cy="124" r="5"/>
    <circle cx="484" cy="138" r="5"/>
    <circle cx="507" cy="117" r="5"/>
    <circle cx="468" cy="131" r="5"/>
  </g>

  <text x="30" y="378" font-size="11" fill="#5b6b7c">Self-reported screen time, 200 students, single class period.</text>
</svg>
